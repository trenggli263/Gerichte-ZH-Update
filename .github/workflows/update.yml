# Datei ablegen unter: .github/workflows/update.yml
# Bewirkt: jeden Mittwoch automatisch neue Entscheide holen, auswerten,
# data.json committen und damit die GitHub-Pages-Seite aktualisieren.

name: Wochensicht aktualisieren

on:
  schedule:
    # GitHub wertet Cron immer in UTC aus, ohne Sommerzeit.
    # 07:00 UTC = 09:00 (Sommer) bzw. 08:00 (Winter) Schweizer Zeit.
    - cron: "0 7 * * 3"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wochensicht-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install requests beautifulsoup4 pdfplumber anthropic

      - name: Daten aktualisieren
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python pipeline.py

      - name: Änderungen committen
        run: |
          git config user.name "wochensicht-bot"
          git config user.email "bot@users.noreply.github.com"
          for f in data.json review_queue.csv lernbeispiele.json; do
            [ -e "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "Keine Änderungen – nichts zu committen."
            exit 0
          fi
          git commit -m "Automatische Aktualisierung $(date +%F)"
          git pull --rebase --autostash
          git push
